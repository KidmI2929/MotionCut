name: Build MotionCut 2.3.0

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

concurrency:
  group: motioncut-230-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Expand MotionCut 2.3.0 source
        shell: bash
        run: |
          set -euxo pipefail
          rm -rf /tmp/motioncut-src
          mkdir -p /tmp/motioncut-src
          unzip -q motioncut-upload-no-aar.zip -d /tmp/motioncut-src
          test -f /tmp/motioncut-src/MotionCut/app/build.gradle.kts
          cp -a /tmp/motioncut-src/MotionCut/. "$GITHUB_WORKSPACE/"
          rm -f app/libs/ffmpeg-kit-custom.aar
          grep -F 'versionName = "2.3.0"' app/build.gradle.kts
          grep -F 'versionCode = 36' app/build.gradle.kts

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK and NDK
        shell: bash
        run: |
          set -euxo pipefail
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort -V | tail -1)"
          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
          "$SDKMANAGER" "platforms;android-35" "platforms;android-36" "build-tools;36.0.0" "ndk;27.2.12479018"

      - name: Install native build tools
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y autoconf automake libtool pkg-config curl git nasm cmake gcc g++ gperf texinfo yasm bison autogen wget autopoint meson ninja-build ragel groff gtk-doc-tools libtasn1-6-dev

      - name: Cache custom FFmpegKit AAR
        id: ffmpeg-cache
        uses: actions/cache@v4
        with:
          path: .ci-cache/ffmpeg-kit-custom.aar
          key: ffmpegkit-8.1-libwebp-arm64-speed-r1

      - name: Build FFmpegKit with libwebp
        if: steps.ffmpeg-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euxo pipefail
          rm -rf /tmp/ffmpegkit-src
          git clone --depth 1 https://github.com/ffmpegkit-maintained/ffmpeg.git /tmp/ffmpegkit-src
          cd /tmp/ffmpegkit-src/android-8.1-lts
          export ANDROID_SDK_ROOT="$ANDROID_HOME"
          export ANDROID_NDK_ROOT="$ANDROID_HOME/ndk/27.2.12479018"
          ./android.sh --speed --api-level=29 --enable-libwebp --enable-android-media-codec --disable-arm-v7a --disable-arm-v7a-neon --disable-x86 --disable-x86-64
          mkdir -p "$GITHUB_WORKSPACE/.ci-cache"
          cp prebuilt/bundle-android-aar/ffmpeg-kit/ffmpeg-kit.aar "$GITHUB_WORKSPACE/.ci-cache/ffmpeg-kit-custom.aar"

      - name: Verify and install custom FFmpeg
        shell: bash
        run: |
          set -euxo pipefail
          rm -rf /tmp/ffmpeg-aar-check
          mkdir -p /tmp/ffmpeg-aar-check
          cd /tmp/ffmpeg-aar-check
          unzip -q "$GITHUB_WORKSPACE/.ci-cache/ffmpeg-kit-custom.aar"
          strings jni/arm64-v8a/libavcodec.so | grep -F -- '--enable-libwebp'
          cd "$GITHUB_WORKSPACE"
          mkdir -p app/libs app/src/main/jniLibs/arm64-v8a
          cp .ci-cache/ffmpeg-kit-custom.aar app/libs/ffmpeg-kit-custom.aar
          cp "$ANDROID_HOME/ndk/27.2.12479018/toolchains/llvm/prebuilt/linux-x86_64/sysroot/usr/lib/aarch64-linux-android/libc++_shared.so" app/src/main/jniLibs/arm64-v8a/libc++_shared.so

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Test and build release
        shell: bash
        run: |
          set -euxo pipefail
          gradle :app:testDebugUnitTest :app:assembleRelease --stacktrace
          test -s app/build/outputs/apk/release/app-release-unsigned.apk

      - name: Align release APK
        shell: bash
        run: |
          set -euxo pipefail
          "$ANDROID_HOME/build-tools/36.0.0/zipalign" -f -p 4 app/build/outputs/apk/release/app-release-unsigned.apk MotionCut-v2.3.0-aligned-unsigned.apk
          "$ANDROID_HOME/build-tools/36.0.0/zipalign" -c -p 4 MotionCut-v2.3.0-aligned-unsigned.apk
          cp "$ANDROID_HOME/build-tools/36.0.0/lib/apksigner.jar" apksigner.jar

      - name: Upload unsigned release
        uses: actions/upload-artifact@v4
        with:
          name: MotionCut-v2.3.0-unsigned
          path: |
            MotionCut-v2.3.0-aligned-unsigned.apk
            apksigner.jar
          if-no-files-found: error
          retention-days: 30
