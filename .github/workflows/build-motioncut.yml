name: Build MotionCut V3
on:
  push:
    branches: [ "main" ]
  workflow_dispatch:
concurrency:
  group: motioncut-v3-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Expand and patch V3 source
        shell: bash
        run: |
          set -euxo pipefail
          rm -rf /tmp/motioncut-src
          mkdir -p /tmp/motioncut-src
          unzip -q motioncut-upload-no-aar.zip -d /tmp/motioncut-src
          cp -a /tmp/motioncut-src/. "$GITHUB_WORKSPACE/"
          rm -f app/libs/ffmpeg-kit-custom.aar
          sed -i 's/private fun formatStudioBytes(bytes:Long):String/fun formatStudioBytes(bytes:Long):String/' app/src/main/java/com/kidmi/videotowebp/StudioOutputUi.kt
          echo '' | base64 -d > /tmp/patch_v3.py
          python3 /tmp/patch_v3.py
          grep -F 'applicationId = "com.kidmi.motioncut.v3"' app/build.gradle.kts
          grep -F 'versionName = "3.0.0"' app/build.gradle.kts
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK and NDK
        shell: bash
        run: |
          set -euxo pipefail
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort -V | tail -1)"
          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
          "$SDKMANAGER" "platforms;android-35" "platforms;android-36" "build-tools;36.0.0" "ndk;27.2.12479018"
      - name: Cache custom FFmpegKit AAR
        id: ffmpeg-cache
        uses: actions/cache@v4
        with:
          path: .ci-cache/ffmpeg-kit-custom.aar
          key: ffmpegkit-8.1-libwebp-arm64-speed-r1
      - name: Build FFmpegKit with libwebp if cache missing
        if: steps.ffmpeg-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y autoconf automake libtool pkg-config curl git nasm cmake gcc g++ gperf texinfo yasm bison autogen wget autopoint meson ninja-build ragel groff gtk-doc-tools libtasn1-6-dev
          git clone --depth 1 https://github.com/ffmpegkit-maintained/ffmpeg.git /tmp/ffmpegkit-src
          cd /tmp/ffmpegkit-src/android-8.1-lts
          export ANDROID_SDK_ROOT="$ANDROID_HOME"
          export ANDROID_NDK_ROOT="$ANDROID_HOME/ndk/27.2.12479018"
          ./android.sh --speed --api-level=29 --enable-libwebp --enable-android-media-codec --disable-arm-v7a --disable-arm-v7a-neon --disable-x86 --disable-x86-64
          mkdir -p "$GITHUB_WORKSPACE/.ci-cache"
          cp prebuilt/bundle-android-aar/ffmpeg-kit/ffmpeg-kit.aar "$GITHUB_WORKSPACE/.ci-cache/ffmpeg-kit-custom.aar"
      - name: Install custom FFmpeg
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p app/libs app/src/main/jniLibs/arm64-v8a
          cp .ci-cache/ffmpeg-kit-custom.aar app/libs/ffmpeg-kit-custom.aar
          cp "$ANDROID_HOME/ndk/27.2.12479018/toolchains/llvm/prebuilt/linux-x86_64/sysroot/usr/lib/aarch64-linux-android/libc++_shared.so" app/src/main/jniLibs/arm64-v8a/libc++_shared.so
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Build V3 release APK
        shell: bash
        run: |
          set -euxo pipefail
          gradle :app:assembleRelease --stacktrace
          "$ANDROID_HOME/build-tools/36.0.0/zipalign" -f -p 4 app/build/outputs/apk/release/app-release-unsigned.apk MotionCut-v3.0.0-aligned-unsigned.apk
      - name: Sign V3 APK
        shell: bash
        run: |
          set -euxo pipefail
          keytool -genkeypair -v -keystore MotionCut-v3-release.jks -storepass motioncutv3 -keypass motioncutv3 -alias motioncutv3 -keyalg RSA -keysize 4096 -validity 10000 -dname "CN=MotionCut V3 Release, OU=MotionCut, O=MotionCut, L=Seoul, C=KR"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" sign --ks MotionCut-v3-release.jks --ks-pass pass:motioncutv3 --key-pass pass:motioncutv3 --out MotionCut-v3.0.0.apk MotionCut-v3.0.0-aligned-unsigned.apk
      - uses: actions/upload-artifact@v4
        with:
          name: MotionCut-v3.0.0
          path: |
            MotionCut-v3.0.0.apk
            MotionCut-v3-release.jks
          if-no-files-found: error
          retention-days: 30
